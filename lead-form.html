<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="style.css"><title>客户登记</title></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-box">TMGM</span><span>TradeMax Partner Access</span></a><nav><a href="products.html">产品</a><a href="accounts.html">账户</a><a href="platforms.html">平台</a><a href="calculators.html">计算器</a><a href="lead-form.html">客户登记</a><a href="crm-leads.html">CRM</a></nav><a class="btn primary" href="https://portal.cnfxhero.com/register?node=MjE4NjI0&language=zh-Hans" target="_blank">开通ECN</a></header><main class="enterprise-form-page"><section class="enterprise-form-shell"><div><p class="eyebrow">CLIENT INTAKE</p><h1>客户信息登记</h1><p>提交后保存到CRM后台，不强制跳转 WhatsApp。中国大陆客户可直接留下微信。</p></div><form class="enterprise-form" onsubmit="submitLeadForm(event)"><div class="form-row"><label>姓名<input name="name"></label><label>微信<input name="wechat" required></label></div><div class="form-row"><label>WhatsApp<input name="whatsapp"></label><label>邮箱<input name="email" type="email"></label></div><div class="form-row"><label>是否开户<select name="registered"><option>未开户</option><option>已开户</option><option>开户中</option></select></label><label>账户<select name="account_type"><option>ECN</option><option>STD</option><option>PM</option><option>PRO</option><option>不确定</option></select></label></div><div class="form-row"><label>产品<select name="interest"><option>黄金</option><option>外汇</option><option>BTC/ETH</option><option>指数</option><option>代理合作</option></select></label><label>来源<input name="source_page" id="sourcePageInput" readonly></label></div><label>备注<textarea name="notes"></textarea></label><label class="privacy"><input type="checkbox" required>同意用于平台开户协助和客户经理对接</label><button class="btn primary" type="submit">提交给客户经理</button><div class="form-message" id="leadFormMessage"></div></form></section></main><script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script><script src="crm-config.js"></script><script src="crm.js"></script><script>sourcePageInput.value=document.referrer||'direct';trackPageView();</script></body></html>
