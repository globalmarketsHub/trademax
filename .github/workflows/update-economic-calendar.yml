name: Update economic calendar

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-economic-calendar.yml'
      - 'scripts/update-economic-calendar.mjs'
      - 'economic-calendar-api.js'
  schedule:
    - cron: '0 22 * * 0'

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch current and next week calendar
        env:
          TRADING_ECONOMICS_API_KEY: ${{ secrets.TRADING_ECONOMICS_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: node scripts/update-economic-calendar.mjs

      - name: Commit updated calendar data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update current and next week economic calendar data
          file_pattern: data/economic-calendar-live.json
