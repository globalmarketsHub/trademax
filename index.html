<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TMGM Chart</title>
<style>
body{margin:0;font-family:Arial;}
#sidebarTradingView{width:400px;height:600px;margin:50px auto;border:1px solid #ddd;border-radius:12px;overflow:hidden;}
</style>
</head>
<body>

<div id="sidebarTradingView"></div>

<script>
function initSidebarTradingViewFinal() {
  const container = document.getElementById("sidebarTradingView");
  if (!container) return;

  container.innerHTML = `
    <div style="width:100%;height:100%;position:relative;">
      <iframe 
        id="tvframe"
        src="https://s.tradingview.com/widgetembed/?symbol=OANDA:XAUUSD&interval=15&theme=light"
        width="100%" 
        height="100%" 
        frameborder="0"
        style="border-radius:12px;">
      </iframe>

      <div id="fallback" style="
        display:none;
        position:absolute;
        top:0;
        left:0;
        width:100%;
        height:100%;
        background:#fff;
        align-items:center;
        justify-content:center;
        flex-direction:column;
        text-align:center;
      ">
        <p style="margin-bottom:10px;">行情加载失败</p>
        <a href="https://cn.tradingview.com/symbols/XAUUSD/" 
           target="_blank"
           style="
             padding:10px 16px;
             background:#075aff;
             color:#fff;
             border-radius:8px;
             text-decoration:none;
           ">
           点击查看实时金价
        </a>
      </div>
    </div>
  `;

  setTimeout(() => {
    try {
      const iframe = document.getElementById("tvframe");
      if (!iframe || iframe.contentWindow.length === 0) {
        document.getElementById("fallback").style.display = "flex";
      }
    } catch (e) {
      document.getElementById("fallback").style.display = "flex";
    }
  }, 4000);
}

initSidebarTradingViewFinal();
</script>

</body>
</html>
