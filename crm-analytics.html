<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRM后台 | 浏览统计</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="admin-body">
  <main class="admin-shell final-admin-shell">
    <aside class="admin-sidebar">
      <h2>TMGM CRM</h2>
      <a href="crm-leads.html">客户意向表</a>
      <a class="active" href="crm-analytics.html">浏览统计</a>
      <a href="index.html">返回网站</a>
      <button onclick="adminLogout()">退出登录</button>
    </aside>

    <section class="admin-main final-admin-main">
      <div class="admin-header">
        <div>
          <p class="eyebrow">TRAFFIC ANALYTICS</p>
          <h1>浏览量、IP与咨询统计</h1>
        </div>
        <button class="primary-btn" onclick="loadEnterpriseAnalytics()">刷新数据</button>
      </div>

      <div class="admin-cards final-admin-cards">
        <div><b id="statViews">--</b><span>总浏览量</span></div>
        <div><b id="statUniqueIP">--</b><span>独立IP</span></div>
        <div><b id="statTodayViews">--</b><span>今日浏览</span></div>
        <div><b id="statQuestions">--</b><span>咨询次数</span></div>
      </div>

      <div class="analytics-grid final-analytics-grid">
        <div class="analytics-card">
          <h3>页面浏览排行</h3>
          <div id="pageRank"></div>
        </div>
        <div class="analytics-card">
          <h3>最近访问记录</h3>
          <div id="recentViews"></div>
        </div>
      </div>
    </section>
  </main>
  <script src="crm-config.js"></script>
  <script src="crm.js"></script>
  <script>requireAdminLogin();loadEnterpriseAnalytics();</script>
</body>
</html>
